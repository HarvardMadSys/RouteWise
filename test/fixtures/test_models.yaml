models:
  # Mock models for unit tests (test/servers/)
  - id: test-model-1
    name: Test Model 1
    provider: vllm
    base_url: http://localhost:8001
    quantization: "bf16"
    input_modalities: ["text"]
    output_modalities: ["text"]
    context_length: 8192
    max_output_length: 4096
    supports_tools: false
    supports_structured_output: false
    supported_params: [temperature, top_p, max_tokens]
    aliases: ["test-alias-1"]
    pricing:
      prompt: "0"
      completion: "0"
      image: "0"
      request: "0"
      input_cache_reads: "0"
      input_cache_writes: "0"
    route:
      - kind: vllm
        weight: 1.0
        base_url: http://localhost:8001/v1

  - id: test-model-2
    name: Test Model 2
    provider: llama
    base_url: http://remote.test
    api_key: test-key
    quantization: "fp16"
    input_modalities: ["text"]
    output_modalities: ["text"]
    context_length: 16384
    max_output_length: 8192
    supports_tools: true
    supports_structured_output: true
    supported_params: [temperature, top_p, top_k, max_tokens, stop, seed]
    aliases: ["test-alias-2"]
    pricing:
      prompt: "0"
      completion: "0"
      image: "0"
      request: "0"
      input_cache_reads: "0"
      input_cache_writes: "0"
    route:
      - kind: llama
        weight: 1.0
        base_url: http://remote.test
        api_key: test-key

  # Real local model for e2e gateway tests (test/external/test_local_gateway.py)
