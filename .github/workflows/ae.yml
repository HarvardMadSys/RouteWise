name: artifact

on:
  push:
    branches: [eurosys27-ae, "ae/**"]
  pull_request:
    branches: [eurosys27-ae]

permissions:
  contents: read

concurrency:
  group: ae-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: artifact smoke on the canonical environment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.9.7
      - run: uv sync --frozen
      - run: uv run python -m artifact smoke
      - name: Reproduce and verify the committed-data figure target
        run: |
          uv run python -m artifact reproduce figure-02-provider-latency
          uv run python -m artifact verify figure-02-provider-latency
