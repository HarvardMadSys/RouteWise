name: artifact

on:
  push:
    branches: [eurosys27-ae, "ae/**"]
  pull_request:
    branches: [eurosys27-ae]

permissions:
  contents: read

concurrency:
  group: ae-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kick-the-tires:
    name: kick the tires on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.9.7
      - run: uv sync --frozen
      - run: bash scripts/kick_the_tires.sh
      - name: Rebuild the committed-data drift figures
        run: |
          uv run python plots/motivation/drift_wall_clock.py \
              --source-dir data/drift_source --output-dir outputs/figures

  container:
    name: kick the tires inside the Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          persist-credentials: false
      - run: docker build -t routewise-ae .
      - run: docker run --rm routewise-ae
