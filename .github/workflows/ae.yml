name: artifact

on:
  push:
    branches: [eurosys27-ae, eurosys2027, "ae/**"]
  pull_request:
    branches: [eurosys27-ae, eurosys2027]

permissions:
  contents: read

concurrency:
  group: ae-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: artifact smoke test on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.9.7
      - run: uv sync --frozen
      - run: bash scripts/artifact_smoke_test.sh

  figures:
    name: committed-data figure reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.9.7
      - run: uv sync --frozen
      - name: Rebuild the drift figures from committed CSVs
        run: |
          uv run python plots/motivation/drift_wall_clock.py \
              --source-dir data/drift_source --output-dir outputs/figures
      - name: Rebuild the TTFT background panels from the committed export
        run: |
          uv run python -m plots.motivation.plot_ttft_background_panels \
              --output-dir outputs/figures
      - name: Recompute and check the recorded real-world results
        run: uv run python scripts/reproduce_real_world.py
      - name: Recompute and check the MiniMax-M3 revision results
        run: |
          uv run python -m scripts.reproduce_real_world_m3
          uv run python -m scripts.reproduce_hedging_tables
          uv run python -m scripts.reproduce_real_world_mechanisms
      - name: Replay PROD with the paper simulator and check Figure 8
        run: uv run python scripts/reproduce_figure8.py --jobs 2

  container:
    name: artifact smoke test inside the Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          persist-credentials: false
      - run: docker build -t routewise-ae .
      - run: docker run --rm routewise-ae
