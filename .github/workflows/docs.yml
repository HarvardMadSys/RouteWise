name: Build Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'serving/**'
      - 'routing/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Allow manual trigger

# NOTE: Documentation is deployed via Cloudflare Pages:
#   - User docs: https://doc.freeinference.org/
#   - Developer docs: https://internaldoc.freeinference.org/
# Cloudflare automatically builds and deploys on push to main.
# This workflow only validates that documentation builds without errors.
permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.5.0"
  UV_SYSTEM_PYTHON: 1

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Build Sphinx documentation
        run: |
          cd docs
          uv run sphinx-build -b html source build/html -W --keep-going

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build/html
          retention-days: 7
