name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    name: Build release wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Verify release tag matches the package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag != expected_tag:
              raise SystemExit(
                  f"release tag {release_tag!r} does not match package version {expected_tag!r}"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"version={version}", file=output)
          PY
      - run: python -m pip install --upgrade build
      - name: Build the dependency-free wheel
        run: python -m build --wheel
      - name: Check the exact wheel contents
        run: python scripts/check_wheel.py dist/*.whl
      - name: Install the release wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify installed package metadata
        working-directory: /tmp
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import routewise

          installed = version("routewise")
          assert routewise.__version__ == installed
          assert len(routewise.__all__) == 13
          print(f"verified routewise {installed}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: routewise-${{ steps.version.outputs.version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/routewise/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: routewise-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish the wheel with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1.14
