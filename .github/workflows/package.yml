name: package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Run the public examples
        run: |
          uv run python examples/basic.py
          uv run python examples/simple_router.py

  wheel:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build==1.5.0
      - run: python -m build --wheel
      - run: python scripts/check_wheel.py dist/*.whl
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m pip check
      - name: Run the public examples against the installed wheel
        working-directory: /tmp
        run: |
          python "$GITHUB_WORKSPACE/examples/basic.py"
          python "$GITHUB_WORKSPACE/examples/simple_router.py"
      - name: Installed-wheel smoke test outside the checkout
        working-directory: /tmp
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from importlib.util import find_spec

          import llm_routewise as rw
          from llm_routewise import Candidate, Provider, Router, route_once

          result = route_once(
              [
                  Candidate("cheap", cost_usd=1.0, latency_ms=100.0),
                  Candidate("fast", cost_usd=2.0, latency_ms=10.0),
              ],
              alpha=0.5,
              seed=7,
          )
          router = Router([Provider("api", price_in=1.0, price_out=2.0)])
          estimated_router = Router([Provider("api", price_in=1.0, price_out=2.0)])
          assert result.provider in result.weights
          assert router.route(input_tokens=10).provider == "api"
          estimated = estimated_router.route(
              input_tokens=10,
              estimated_output_tokens=5,
          )
          assert estimated.expected_cost_usd == 20 / 1_000_000
          assert rw.__version__ == version("llm-routewise")
          assert len(rw.__all__) == 13
          assert find_spec("routewise") is None
          forbidden_modules = (
              "llm_routewise.sim",
              "llm_routewise.offline",
              "llm_routewise.metrics",
              "llm_routewise.capacity",
              "llm_routewise.schemas",
              "experiments",
              "routewise_cli",
          )
          for module in forbidden_modules:
              assert find_spec(module) is None, f"unexpected installed module: {module}"
          PY
