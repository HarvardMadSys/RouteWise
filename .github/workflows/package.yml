name: package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build==1.5.1 pytest==9.1.1 ruff==0.15.21
      - name: Lint the public library surface
        run: >-
          ruff check
          routewise/__init__.py routewise/errors.py routewise/facade.py
          routewise/stateless.py routewise/_capacity_controller.py
          routewise/_output_length.py routewise/core scripts/check_wheel.py
          tests/unit/scripts/test_check_wheel.py
          tests/unit/facade tests/unit/policies/test_hedging_helpers.py
      - name: Run dependency-free library tests
        run: >-
          pytest -q tests/unit/facade tests/unit/core
          tests/unit/scripts/test_check_wheel.py
          tests/unit/policies/test_hedging_helpers.py
          --ignore=tests/unit/core/test_router_env_parity.py
      - run: python -m build --wheel
      - run: python scripts/check_wheel.py dist/*.whl
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pip check
      - name: Installed-wheel smoke test outside the checkout
        working-directory: /tmp
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import sys

          import routewise
          from routewise import Candidate, Provider, Router, route_once

          result = route_once(
              [
                  Candidate("cheap", cost_usd=1.0, latency_ms=100.0),
                  Candidate("fast", cost_usd=2.0, latency_ms=10.0),
              ],
              alpha=0.5,
              seed=7,
          )
          router = Router([Provider("api", price_in=1.0, price_out=2.0)])
          assert result.provider in result.weights
          assert router.route(input_tokens=10).provider == "api"
          assert routewise.__version__ == version("routewise")
          assert len(routewise.__all__) == 13
          assert "experiments" not in sys.modules
          assert "numpy" not in sys.modules
          assert "pandas" not in sys.modules
          assert "routewise.sim" not in sys.modules
          assert "scipy" not in sys.modules
          PY

  research-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - name: Check source-checkout compatibility
        run: >-
          uv run pytest -q
          tests/unit/core/test_router_env_parity.py
          tests/test_architecture_scaffold.py
          tests/unit/cli/test_optional_extras.py
