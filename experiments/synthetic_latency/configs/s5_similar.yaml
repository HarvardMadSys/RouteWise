name: s5_similar
description: >
  A: P50=200 ms $1/M. B: P50=207 ms $0.8/M. C: P50=215 ms $0.5/M. All are
  within V2's 10% near-best band; C is cheapest.
primary_slo_ms: 2000.0
slo_thresholds_ms: [1000.0, 2000.0, 3000.0, 5000.0]
workload:
  source: synthetic
  n_requests: 2000
  duration_seconds: 3600.0
  arrival_process: poisson
  seed: 0
  input_tokens: 100
  output_token_distribution:
    name: lognormal
    mu: 4.0
    sigma: 1.0
providers:
  - name: A
    tier: api
    cost_per_token: 0.000001
    ttft_distribution:
      name: lognormal_p50_sigma
      p50_ms: 200.0
      sigma: 0.5
    tps_distribution: &default_tps
      name: lognormal
      mu: 5.5
      sigma: 0.3
  - name: B
    tier: api
    cost_per_token: 0.0000008
    ttft_distribution:
      name: lognormal_p50_sigma
      p50_ms: 207.0
      sigma: 0.5
    tps_distribution: *default_tps
  - name: C
    tier: api
    cost_per_token: 0.0000005
    ttft_distribution:
      name: lognormal_p50_sigma
      p50_ms: 215.0
      sigma: 0.5
    tps_distribution: *default_tps
