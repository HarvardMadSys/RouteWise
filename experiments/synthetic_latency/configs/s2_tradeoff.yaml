name: s2_tradeoff
description: >
  A is cheap ($0.5/M) and slower (P50=500 ms, P99=1600 ms). B is expensive
  ($2/M) and fast (P50=100 ms).
primary_slo_ms: 2000.0
slo_thresholds_ms: [1000.0, 2000.0, 3000.0, 5000.0]
workload:
  source: synthetic
  n_requests: 2000
  duration_seconds: 3600.0
  arrival_process: poisson
  seed: 0
  input_tokens: 100
  output_token_distribution:
    name: lognormal
    mu: 4.0
    sigma: 1.0
providers:
  - name: A
    tier: api
    cost_per_token: 0.0000005
    ttft_distribution:
      name: lognormal_p50_p99
      p50_ms: 500.0
      p99_ms: 1600.0
    tps_distribution: &default_tps
      name: lognormal
      mu: 5.5
      sigma: 0.3
  - name: B
    tier: api
    cost_per_token: 0.000002
    ttft_distribution:
      name: lognormal_p50_sigma
      p50_ms: 100.0
      sigma: 0.5
    tps_distribution: *default_tps
