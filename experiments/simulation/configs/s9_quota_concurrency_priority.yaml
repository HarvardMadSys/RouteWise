name: s9_quota_concurrency_priority
description: >-
  S_Q (quota=800, P50=450 ms, $0), S_C (C=4 slots, P50=140 ms, 2s service,
  $0), and S_A (P50=100 ms, $3/M). Quota-first stays on S_Q while
  concurrency-first prefers S_C. This scenario is intended to separate fixed
  tier-priority baselines in a mixed-tier world.
primary_slo_ms: 1000.0
slo_thresholds_ms: [1000.0, 2000.0, 3000.0, 5000.0]
workload:
  source: burstgpt
  n_requests: 1800
  duration_seconds: 600.0
  arrival_process: trace
  seed: 0
  input_tokens: 100
  output_token_distribution:
    name: lognormal
    mu: 4.0
    sigma: 1.0
providers:
  - name: Ollama_S_Q
    tier: quota
    cost_per_token: 0.0
    quota_size: 800
    quota_window_sec: 86400.0
    ttft_distribution:
      name: lognormal_p50_p99
      p50_ms: 450.0
      p99_ms: 1200.0
    tps_distribution: &default_tps
      name: lognormal
      mu: 5.5
      sigma: 0.3
  - name: Featherless_S_C
    tier: concurrency
    cost_per_token: 0.0
    concurrency_limit: 4
    ttft_distribution:
      name: lognormal_p50_p99
      p50_ms: 140.0
      p99_ms: 600.0
    service_time_distribution:
      name: lognormal_p50_sigma
      p50_ms: 2000.0
      sigma: 0.5
    tps_distribution: *default_tps
  - name: Together_S_A
    tier: api
    cost_per_token: 0.000003
    ttft_distribution:
      name: lognormal_p50_p99
      p50_ms: 100.0
      p99_ms: 400.0
    tps_distribution: *default_tps
