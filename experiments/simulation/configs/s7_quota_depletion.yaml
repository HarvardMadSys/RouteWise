name: s7_quota_depletion
description: >-
  S_Q (quota=100, P50=300 ms, $0) and S_A (P50=200 ms, $3/M). 200-request
  workload causes quota to deplete at ~50 % of the run. Two-layer flips
  cliff-wise at z=1; joint_v2 ramps smoothly as psi(z) climbs.
primary_slo_ms: 2000.0
slo_thresholds_ms: [1000.0, 2000.0, 3000.0, 5000.0]
workload:
  source: synthetic
  n_requests: 200
  duration_seconds: 3600.0
  arrival_process: poisson
  seed: 0
  input_tokens: 100
  output_token_distribution:
    name: lognormal
    mu: 4.0
    sigma: 1.0
providers:
  - name: Chutes_S_Q
    tier: quota
    cost_per_token: 0.0
    quota_size: 100
    quota_window_sec: 86400.0
    ttft_distribution:
      name: lognormal_p50_sigma
      p50_ms: 300.0
      sigma: 0.5
    tps_distribution: &default_tps
      name: lognormal
      mu: 5.5
      sigma: 0.3
  - name: Together_S_A
    tier: api
    cost_per_token: 0.000003
    ttft_distribution:
      name: lognormal_p50_sigma
      p50_ms: 200.0
      sigma: 0.5
    tps_distribution: *default_tps
