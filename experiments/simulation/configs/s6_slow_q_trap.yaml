name: s6_slow_q_trap
description: >-
  S_Q is free but slow (P50=2000 ms). S_A is fast (P50=100 ms) at $3/M.
  Two-layer greedy-by-tier routes all traffic to S_Q and blows the SLO;
  joint_v2 rejects S_Q via the P50 band.
primary_slo_ms: 1000.0
slo_thresholds_ms: [500.0, 1000.0, 2000.0, 5000.0]
workload:
  source: burstgpt
  n_requests: 500
  duration_seconds: 86400.0
  arrival_process: trace
  seed: 0
  input_tokens: 100
  output_token_distribution:
    name: lognormal
    mu: 4.0
    sigma: 1.0
providers:
  - name: Chutes_S_Q
    tier: quota
    cost_per_token: 0.0
    quota_size: 1000
    quota_window_sec: 86400.0
    ttft_distribution:
      name: lognormal_p50_p99
      p50_ms: 2000.0
      p99_ms: 5000.0
    tps_distribution: &default_tps
      name: lognormal
      mu: 5.5
      sigma: 0.3
  - name: Together_S_A
    tier: api
    cost_per_token: 0.000003
    ttft_distribution:
      name: lognormal_p50_p99
      p50_ms: 100.0
      p99_ms: 400.0
    tps_distribution: *default_tps
