greedy_cost:
  policy: BaselinePolicy
  params:
    mode: greedy_cost

greedy_latency:
  policy: BaselinePolicy
  params:
    mode: greedy_latency

random:
  policy: BaselinePolicy
  params:
    mode: random

ablation_lp_only:
  policy: RouteWisePolicy
  params:
    hedging: false
    explorer: false

ablation_lp_hedging:
  policy: RouteWisePolicy
  params:
    hedging: probability_target
    explorer: false

routewise:
  policy: RouteWisePolicy
  params:
    hedging: probability_target
    explorer: true
