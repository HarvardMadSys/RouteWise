# Real-world latency profiles for simulator S_A experiments.

schema_version: 2

profiles:
  qwen3_24h:
    model: qwen3_235b
    source: qwen3_24h
    artifact: qwen3_24h.npz
    metadata: qwen3_24h.json

  minimax_m25_openrouter:
    model: minimax/minimax-m2.5
    source: minimax_m25_openrouter_24h
    artifact: minimax_m25_openrouter_24h.npz
    metadata: minimax_m25_openrouter_24h.json
    price_source: openrouter_endpoint_snapshot

  minimax_m25_shared_profile_8h:
    model: minimax/minimax-m2.5
    source: real_eval_minimax_m25_burstgpt_cap10s_shared_profile_8h
    artifact: minimax_m25_shared_profile_8h.npz
    metadata: minimax_m25_shared_profile_8h.json
    price_source: static_from_inventory

pools:
  rw3:
    description: "Small real-world S_A pool with clear latency spread."
    profile: qwen3_24h
    pricing:
      source: static
      default_input_per_m: 0.30
      default_output_per_m: 1.20
      overrides:
        DeepInfra:
          input_per_m: 0.27
          output_per_m: 0.95
    providers:
      - WandB
      - DeepInfra
      - Novita

  rw8:
    description: "Larger real-world OpenRouter S_A pool with realistic overlap."
    profile: qwen3_24h
    pricing:
      source: static
      default_input_per_m: 0.30
      default_output_per_m: 1.20
      overrides:
        DeepInfra:
          input_per_m: 0.27
          output_per_m: 0.95
    providers:
      - WandB
      - DeepInfra
      - Google
      - Alibaba
      - Novita
      - Cerebras
      - SiliconFlow
      - AtlasCloud

  minimax_m25_rw8:
    description: "MiniMax M2.5 OpenRouter S_A pool selected for cost/latency spread with low distribution overlap."
    profile: minimax_m25_openrouter
    pricing:
      source: metadata_openrouter_price
    selection:
      representative_request_tokens:
        input: 200
        output: 300
      average_pairwise_latency_overlap: 0.361
      note: "SiliconFlow had degraded OpenRouter status in the captured price snapshot; keep this caveat in paper text if used."
    providers:
      - Inceptron
      - Friendli
      - DeepInfra
      - SambaNova
      - Venice
      - AtlasCloud
      - Chutes
      - SiliconFlow

  minimax_m25_shared_profile_8h_api8:
    description: "MiniMax M2.5 cap10s 8h real-eval shared-profile events: true API providers only; excludes __or_auto__/__or_sort_* aggregate baselines."
    profile: minimax_m25_shared_profile_8h
    pricing:
      source: metadata_openrouter_price
    providers:
      - Chutes
      - DeepInfra
      - Novita
      - AtlasCloud
      - Phala
      - SiliconFlow
      - AkashML
      - WandB

pooled:
  rw8_pooled:
    description: "All RW8 samples concatenated into one shared latency distribution."
    profile: qwen3_24h
    source_providers:
      - WandB
      - DeepInfra
      - Google
      - Alibaba
      - Novita
      - Cerebras
      - SiliconFlow
      - AtlasCloud
