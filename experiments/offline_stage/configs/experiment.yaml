# Experiment Configuration
# Main configuration for offline routing experiments
# Currently configured for single model (ChatGPT) experiments

models:
  # Subscription provider (Chutes) - assumes it can serve ChatGPT
  - id: chutes-subscription
    name: "Chutes Subscription"
    provider: chutes
    type: subscription
    subscription_plan: chutes  # fee/quota loaded from experiments/subscription_plans.yaml

  # API provider - ChatGPT pricing
  - id: openai-chatgpt
    name: "OpenAI ChatGPT"
    provider: openai
    provider_model_id: "gpt-3.5-turbo"
    type: api
    pricing:
      prompt: "1.5"            # $1.5 per 1M input tokens
      completion: "2.0"        # $2.0 per 1M output tokens

# Simulation settings
simulation:
  num_subscriptions: 1         # Number of subscription accounts
  days_per_month: 30           # Days per month for cost calculation
  default_subscription: "chutes-subscription"
  default_api_fallback: "openai-chatgpt"

# Strategy configurations
strategies:
  # Phase 1: Optimal strategy
  - name: optimal
    enabled: true

  # Phase 2: Greedy (to be implemented)
  # - name: greedy
  #   enabled: false

  # Phase 3: TwoStep (to be implemented)
  # - name: two_step
  #   enabled: false

# Dataset configuration
dataset:
  path: "data/community_logs.csv"
  timestamp_unit: "seconds"    # Timestamp unit in CSV

  # Filter to only load requests for this model (set to null for all models)
  filter_model: null           # Options: specific model name, or null for all models

# Multi-model API pricing (per 1M tokens)
# Used when calculating API cost for different models
# Prices updated: 2025-01
model_pricing:
  # Llama models (Meta) - OpenRouter pricing
  # Source: https://openrouter.ai/
  llama-3.3-70b-instruct:
    input: 0.25
    output: 0.75
  llama-4-scout: # together ai api pricing
    input: 0.18
    output: 0.59
  llama-4-maverick:
    input: 0.27
    output: 0.85
  # Gemini models (Google) - unified pricing after 2025 update
  # Source: https://ai.google.dev/gemini-api/docs/pricing
  gemini-2.5-flash:
    input: 0.30
    output: 2.50
  gemini-2.5-flash-preview-09-2025:
    input: 0.30
    output: 2.50
  # GLM models (Zhipu)
  # Source: https://bigmodel.cn/pricing
  glm-4.5:
    input: 0.6
    output: 2.2
  glm-4.6:
    input: 0.6
    output: 2.2
  # DeepSeek models
  # Source: https://api-docs.deepseek.com/quick_start/pricing
  # Note: deepseek-chat is mapped to deepseek-r1 in loader.py
  deepseek-r1:
    input: 0.55
    output: 2.19
  # Qwen models
  qwen3-coder-30b:
    input: 0.07
    output: 0.27
  # MiniMax models
  minimax-m2:
    input: 0.30
    output: 1.20
  minimax-m2.5:
    input: 0.30
    output: 1.20
  # OpenAI models (hypothetical future pricing)
  gpt-5:
    input: 1.25
    output: 10.00
  gpt-5.1:
    input: 1.25
    output: 10.00
  # Anthropic Claude models (hypothetical future pricing)
  # Naming: claude-{version}-{tier}
  claude-4.5-opus:
    input: 5.00
    output: 25.00
  claude-4.5-sonnet:
    input: 3.00
    output: 15.00
  claude-4.1-opus:
    input: 15.00
    output: 75.00
  # Google Gemini models
  # Source: https://ai.google.dev/gemini-api/docs/pricing
  # Gemini 3 Pro: $2/$4 input (<=/>200K), $12/$18 output (<=/>200K)
  gemini-3-pro:
    input: 2.00
    output: 12.00
  glm-4.5-air:
    input: 0.20
    output: 1.1
  glm-4.7:
    input: 0.6
    output: 2.2
  # NOTE: No default fallback - unknown models will raise an error

# =============================================================================
# Stage 1: Fixed-Window Subscription Plans
# =============================================================================
# Each plan defines a window-based quota constraint.
# Models within the same plan share the quota (compete for slots).
# Reference: Official rate limit documentation from each provider.

# Active plans for main experiments (baseline tiers)
# Change this list to switch between tiers for sensitivity analysis
active_plans:
  - openai_plus        # 3h/160 (ChatGPT Plus)
  - anthropic_pro      # 5h/45  (Claude Pro)
  - zai_glm_lite       # 5h/120 (GLM Lite)

plans:
  # ---------------------------------------------------------------------------
  # OpenAI (ChatGPT Plus)
  # ---------------------------------------------------------------------------
  # Source: OpenAI Help Center - ChatGPT Usage Limits
  openai_plus:
    window_hours: 3
    quota_per_window: 160
    quota_unit: message
    monthly_fee: 20.0
    supported_models:
      - gpt-5
      - gpt-5.1
      - gpt-5.2
    notes: "GPT-5/5.2 ~160 messages per 3 hours (Plus tier); marked as temporary increase."

  # OpenAI Thinking model has separate weekly quota
  openai_plus_thinking:
    window_hours: 168  # 1 week
    quota_per_window: 3000
    quota_unit: message
    monthly_fee: 20.0  # Same subscription, different resource
    supported_models:
      - gpt-5.2-thinking
    notes: "GPT-5.2 Thinking: 3000 messages/week when manually selected."

  # ---------------------------------------------------------------------------
  # Anthropic (Claude)
  # ---------------------------------------------------------------------------
  # Source: Anthropic Help Center - Claude Usage Limits
  # Note: Actual limits vary with message length/context; using official lower bounds.
  anthropic_pro:
    window_hours: 5
    quota_per_window: 45
    quota_unit: message
    monthly_fee: 20.0
    supported_models:
      - claude-4.5-opus
      - claude-4.5-sonnet
      - claude-4.1-opus
      - claude-4.1-sonnet
    notes: "At least ~45 messages per 5 hours; varies with length/context."

  anthropic_max_5x:
    window_hours: 5
    quota_per_window: 225
    quota_unit: message
    monthly_fee: 100.0
    supported_models:
      - claude-4.5-opus
      - claude-4.5-sonnet
      - claude-4.1-opus
      - claude-4.1-sonnet
    notes: "Max 5x tier: at least ~225 messages per 5 hours."

  anthropic_max_20x:
    window_hours: 5
    quota_per_window: 900
    quota_unit: message
    monthly_fee: 200.0
    supported_models:
      - claude-4.5-opus
      - claude-4.5-sonnet
      - claude-4.1-opus
      - claude-4.1-sonnet
    notes: "Max 20x tier: at least ~900 messages per 5 hours."

  # ---------------------------------------------------------------------------
  # Z.ai (GLM) Coding Plan
  # ---------------------------------------------------------------------------
  # Source: Z.ai Coding Plan documentation
  # Note: Quota applies to supported coding tools; API calls billed separately.
  zai_glm_lite:
    window_hours: 5
    quota_per_window: 120
    quota_unit: prompt
    monthly_fee: 15.0
    supported_models:
      - glm-4.6
      - glm-4.7
    notes: "~120 prompts per 5 hours (estimate). Tool-only quota."

  zai_glm_pro:
    window_hours: 5
    quota_per_window: 600
    quota_unit: prompt
    monthly_fee: 30.0
    supported_models:
      - glm-4.6
      - glm-4.7
    notes: "~600 prompts per 5 hours (estimate)."

  zai_glm_max:
    window_hours: 5
    quota_per_window: 2400
    quota_unit: prompt
    monthly_fee: 50.0
    supported_models:
      - glm-4.6
      - glm-4.7
    notes: "~2400 prompts per 5 hours (estimate)."

  # ---------------------------------------------------------------------------
  # Ollama Cloud (Pro)
  # ---------------------------------------------------------------------------
  # Source: Empirically measured from 60min probe on 2026-04-12
  # Probe: 271 reqs in 60min consumed 0.3% of 5h session budget.
  # Inferred session capacity: ~90,000 requests (271 / 0.003).
  # Weekly usage: 0%. Usage measured by GPU infrastructure time.
  # Bottleneck is throughput (4.5 req/min serial), not quota.
  ollama_pro:
    window_hours: 5
    quota_per_window: 90000
    quota_unit: message
    monthly_fee: 20.0
    supported_models:
      - glm-4.7
      - minimax-m2.5
    notes: "271 reqs/60min = 0.3% of 5h session. Inferred ~90K capacity. Throughput-limited at ~4.5 req/min (serial), not quota-limited."

# =============================================================================
# Stage 2: Subscription Provider Configurations
# =============================================================================
# Defines model compatibility for dual-subscription routing.
# Fee/quota facts for Chutes come from experiments/subscription_plans.yaml.
subscriptions:
  # S_Q: Daily Quota Subscription (Chutes)
  chutes:
    subscription_plan: chutes
    supported_models:
      - llama-3.3-70b-instruct
      - llama-4-scout
      - llama-4-maverick
      - glm-4.5
      - glm-4.6
      - glm-4.5-air
      - glm-4.7
      - deepseek-r1
      - qwen3-coder-30b
      - minimax-m2

  # S_C Options: Concurrency-limited subscriptions
  # Choose one via --sc-config parameter

  # Option 1: Featherless AI Premium ($25/mo, C=4)
  # https://featherless.ai/docs/model-compatibility
  featherless_premium:
    type: concurrency
    monthly_fee: 25.0
    concurrency_limit: 4
    supported_models:
      llama-3.3-70b-instruct:
        multiplier: 4
      glm-4.6:
        multiplier: 4
      deepseek-r1:
        multiplier: 4

  # Option 2: Featherless AI Scale ($75/mo, C=8)
  featherless_scale:
    type: concurrency
    monthly_fee: 75.0
    concurrency_limit: 8
    supported_models:
      llama-3.3-70b-instruct:
        multiplier: 2
      glm-4.6:
        multiplier: 2
      deepseek-r1:
        multiplier: 2

  # Option 3: Local GPU (sunk cost $0, C=8)
  # Hardware already purchased, marginal cost = $0
  local_gpu:
    type: concurrency
    monthly_fee: 0.0
    concurrency_limit: 8
    supported_models:
      # 70B+ models (multiplier=4)
      llama-3.3-70b-instruct:
        multiplier: 4
      llama-4-maverick:
        multiplier: 4
      glm-4.6:
        multiplier: 4
      glm-4.5:
        multiplier: 4
      glm-4.7:
        multiplier: 4
      deepseek-r1:
        multiplier: 4
      # 30B models (multiplier=2)
      qwen3-coder-30b:
        multiplier: 2
      minimax-m2:
        multiplier: 2
      # Small models (multiplier=1)
      llama-4-scout:
        multiplier: 1
      glm-4.5-air:
        multiplier: 1

# Output settings
output:
  results_dir: "experiment/results"
  save_decisions: false        # Save individual routing decisions (large file)
  generate_plots: false        # Generate visualization plots
  log_level: "INFO"            # Logging level: DEBUG, INFO, WARNING, ERROR
