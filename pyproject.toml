[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routewise"
version = "0.1.0"
description = "RouteWise core routing algorithms, simulator, and experiment harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RouteWise Authors" }]
dependencies = []

[project.optional-dependencies]
sim = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pulp>=2.7.0",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
    "tqdm>=4.65.0",
]
real-eval = [
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]
offline = [
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pulp>=2.7.0",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
    "tqdm>=4.65.0",
]
plots = [
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]
scripts = [
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "scipy>=1.11.0",
    "tqdm>=4.65.0",
]
agent-benchmark = [
    # gateway probe, recorder, metrics
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # agent driver + SWE-bench grading (heavier; needed from the agent-run stage on)
    "mini-swe-agent>=1.0",
    "swebench>=3.0",
]

[project.scripts]
routewise = "routewise_cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
  "routewise",
  "routewise.*",
  "routewise_cli",
  "routewise_cli.*",
  "experiments",
  "experiments.*",
  "rwsim",
  "rwsim.*",
]

[tool.setuptools.package-data]
experiments = [
  "offline_stage/configs/*.yaml",
  "real_evaluation/data/*.json",
  "simulation/latency_profiles/*.json",
  "simulation/latency_profiles/*.npz",
  "simulation/latency_profiles/*.yaml",
  "simulation/presets.yaml",
  "subscription_plans.yaml",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "perf: performance regression tests",
  "external: tests that hit external/local servers",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # Ruff-specific rules
]
ignore = [
  "E203",  # whitespace before ':' (black/pep8 conflict)
  "E501",  # line too long (handled by formatter)
  "E402",  # module import not at top of file (for now)
  "B008",  # FastAPI Depends pattern is OK
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydocstyle]
convention = "google"
add-ignore = [
  "D104",  # missing docstring in public package
  "D105",  # magic method docstring not required
  "D107",  # __init__ docstring not required
  "D202",  # conflicts with ruff-format (blank line after docstring)
]
match = ".+\\.py"
match-dir = "(?!tests|test|.venv|data).*"

[dependency-groups]
dev = [
  "matplotlib>=3.8.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pulp>=2.7.0",
  "pytest>=8.0.0",
  "pydocstyle>=6.3.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "ruff>=0.5.0",
  "scipy>=1.11.0",
  "tqdm>=4.65.0",
  "pre-commit>=3.6.0",
]
