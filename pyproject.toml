[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-routewise"
version = "0.2.0"
description = "Cost-aware, latency-optimized routing for multiple LLM API providers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Muxin Tian" },
  { name = "Haoran Ni" },
  { name = "Yiyan Zhai" },
  { name = "Yangsun Park" },
  { name = "Juncheng Yang" },
]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://harvardmadsys.github.io/RouteWise/"
Repository = "https://github.com/HarvardMadSys/RouteWise"
Documentation = "https://github.com/HarvardMadSys/RouteWise/tree/main/docs"
Changelog = "https://github.com/HarvardMadSys/RouteWise/blob/main/CHANGELOG.md"
Issues = "https://github.com/HarvardMadSys/RouteWise/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = [
  "llm_routewise",
  "llm_routewise.core",
]

[tool.setuptools.package-data]
llm_routewise = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "perf: performance regression tests",
  "external: tests that hit external/local servers",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # Ruff-specific rules
]
ignore = [
  "E203",  # whitespace before ':' (black/pep8 conflict)
  "E501",  # line too long (handled by formatter)
  "E402",  # module import not at top of file (for now)
  "B008",  # FastAPI Depends pattern is OK
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydocstyle]
convention = "google"
add-ignore = [
  "D104",  # missing docstring in public package
  "D105",  # magic method docstring not required
  "D107",  # __init__ docstring not required
  "D202",  # conflicts with ruff-format (blank line after docstring)
]
match = ".+\\.py"
match-dir = "(?!tests|test|.venv|data).*"

[dependency-groups]
dev = [
  "matplotlib>=3.8.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pulp>=2.7.0",
  "pytest>=8.0.0",
  "pydocstyle>=6.3.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "ruff>=0.5.0",
  "scipy>=1.11.0",
  "tqdm>=4.65.0",
  "pre-commit>=3.6.0",
]
agent-benchmark = [
  "mini-swe-agent>=1.0",
  "swebench>=3.0",
]
