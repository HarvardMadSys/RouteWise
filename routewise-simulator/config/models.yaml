  - id: custom-gpt-5 # Cursor-friendly aliases
    name: GPT-5
    provider: openai # Azure OpenAI
    provider_model_id: "gpt-5"
    base_url: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    quantization: "fp16"
    input_modalities: ["text", "image"]
    output_modalities: ["text"]
    context_length: 400000
    max_output_length: 128000
    supports_tools: true
    supports_structured_output: true
    supported_params: [temperature, top_p, max_tokens, stop, frequency_penalty, presence_penalty, seed]
    aliases: ["gpt-5", "gpt5", "openai/gpt-5"]
    pricing:
      prompt: "1.25"           # Input per 1M tokens
      completion: "10"          # Output per 1M tokens
      request: "0"
      input_cache_reads: "0.125"  # Cached input per 1M tokens
      input_cache_writes: "0"    # No explicit write cost
    route:
      - kind: openai
        weight: 1.0
        base_url: ${OPENAI_BASE_URL}
        api_key: ${OPENAI_API_KEY}
        provider_model_id: "gpt-5"

