  - id: custom-claude-4.1-opus # Cursor-friendly aliases
    name: Claude Opus 4.1
    provider: claude
    provider_model_id: "claude-opus-4.1"
    base_url: ${CLAUDE_BASE_URL}
    api_key: ${CLAUDE_OPUS_KEY}
    quantization: "fp16"
    input_modalities: ["text", "image"]
    output_modalities: ["text"]
    context_length: 200000
    max_output_length: 32000
    supports_tools: true
    supports_structured_output: false
    supported_params: [temperature, top_p, top_k, max_tokens, stop]
    aliases: ["claude-opus-4.1"]
    pricing:
      # Vertex AI pricing
      prompt: "15.0"              # Input tokens per 1M
      completion: "75.0"          # Output tokens per 1M
      request: "0"
      input_cache_reads: "1.5"    # Cache hit tokens per 1M (90% discount vs $15)
      input_cache_writes: "18.75" # Cache write tokens per 1M (5m TTL only on Vertex AI)
    route:
      - kind: claude
        weight: 1.0
        base_url: ${CLAUDE_BASE_URL}
        api_key: ${CLAUDE_OPUS_KEY}
        provider_model_id: "claude-opus-4.1"

