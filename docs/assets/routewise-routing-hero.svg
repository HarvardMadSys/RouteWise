<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title description">
  <title id="title">How RouteWise makes and learns from routing decisions</title>
  <desc id="description">A request enters RouteWise. Cost and latency layers produce a provider decision with optional hedge checkpoints. The application dispatches the primary provider and may dispatch a backup after calling hedge_now. Reported outcomes update RouteWise.</desc>
  <defs>
    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2937" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#59636e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2b777a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="24" fill="#fbfcfe" stroke="#d7dee7" stroke-width="1.6"/>
  <path d="M28 9H1172" fill="none" stroke="#a51c30" stroke-width="6" stroke-linecap="round"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="38" y="43" fill="#6b7280" font-size="14" font-weight="750" letter-spacing="1.8">ADAPTIVE ROUTING LOOP</text>

    <g filter="url(#card-shadow)">
      <rect x="35" y="104" width="132" height="104" rx="18" fill="#ffffff" stroke="#b8c1cc" stroke-width="1.7"/>
      <circle cx="67" cy="137" r="14" fill="#f7e4e7"/>
      <path d="M61 137H73M67 131V143" stroke="#a51c30" stroke-width="2.2" stroke-linecap="round"/>
      <text x="91" y="136" fill="#1f2937" font-size="15" font-weight="750">Request</text>
      <text x="55" y="170" fill="#59636e" font-size="14">input tokens</text>
      <text x="55" y="190" fill="#59636e" font-size="14">cached estimate</text>

      <rect x="213" y="66" width="334" height="185" rx="22" fill="#ffffff" stroke="#a51c30" stroke-width="2.2"/>
      <circle cx="244" cy="97" r="11" fill="#a51c30"/>
      <circle cx="244" cy="97" r="4" fill="#ffffff"/>
      <text x="265" y="103" fill="#1f2937" font-size="20" font-weight="780">RouteWise</text>
      <text x="510" y="101" text-anchor="end" fill="#8a3a49" font-size="13" font-weight="700">IN-PROCESS POLICY</text>

      <rect x="235" y="122" width="290" height="48" rx="12" fill="#eef5ff" stroke="#4f81bd" stroke-width="1.5"/>
      <circle cx="256" cy="146" r="8" fill="#4f81bd"/>
      <path d="M252 146H260M256 142V150" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="275" y="143" fill="#2d5f96" font-size="14" font-weight="750">COST LAYER</text>
      <text x="275" y="161" fill="#456987" font-size="14">request cost · tunable budget</text>

      <rect x="235" y="181" width="290" height="48" rx="12" fill="#fff2f2" stroke="#c94141" stroke-width="1.5"/>
      <circle cx="256" cy="205" r="8" fill="#c94141"/>
      <path d="M252 205H260M256 201V209" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="275" y="202" fill="#9f2d38" font-size="14" font-weight="750">LATENCY LAYER</text>
      <text x="275" y="220" fill="#8d4a50" font-size="14">rolling TTFT · tail checkpoints</text>

      <rect x="593" y="94" width="167" height="132" rx="20" fill="#eef8f7" stroke="#2b777a" stroke-width="1.8"/>
      <path d="M618 119H635L644 128V151H618Z" fill="#ffffff" stroke="#2b777a" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M635 119V128H644" fill="none" stroke="#2b777a" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="657" y="127" fill="#245f62" font-size="14" font-weight="800" letter-spacing="0.8">DECISION</text>
      <line x1="616" y1="163" x2="737" y2="163" stroke="#b8d8d5"/>
      <circle cx="621" cy="184" r="4" fill="#2b777a"/>
      <text x="633" y="188" fill="#345f61" font-size="14">primary provider</text>
      <circle cx="621" cy="207" r="4" fill="#2b777a" fill-opacity="0.58"/>
      <text x="633" y="211" fill="#4e7072" font-size="14">hedge checkpoints</text>

      <rect x="806" y="94" width="156" height="132" rx="20" fill="#ffffff" stroke="#8b96a3" stroke-width="1.7"/>
      <circle cx="833" cy="124" r="10" fill="#eef0f3"/>
      <path d="M828 128C828 122 838 122 838 128M833 118A3.5 3.5 0 1 0 833 125A3.5 3.5 0 1 0 833 118" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round"/>
      <text x="852" y="129" fill="#1f2937" font-size="14" font-weight="780">Your app</text>
      <line x1="829" y1="148" x2="940" y2="148" stroke="#d7dee7"/>
      <text x="884" y="173" text-anchor="middle" fill="#59636e" font-size="14">owns network I/O</text>
      <text x="884" y="194" text-anchor="middle" fill="#59636e" font-size="14">clients · credentials</text>

      <rect x="1010" y="77" width="158" height="70" rx="17" fill="#eef8ed" stroke="#4b8c4b" stroke-width="1.6"/>
      <circle cx="1033" cy="112" r="8" fill="#2e7d32"/>
      <path d="M1029 112L1032 115L1038 108" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1049" y="108" fill="#225d27" font-size="14" font-weight="780">Primary</text>
      <text x="1049" y="127" fill="#517b55" font-size="14">provider API</text>

      <rect x="1010" y="174" width="158" height="70" rx="17" fill="#f7fbf6" stroke="#83b780" stroke-width="1.6"/>
      <circle cx="1033" cy="209" r="9" fill="#e2f3df" stroke="#70a76d" stroke-width="1.2"/>
      <path d="M1033 204V209L1037 211" fill="none" stroke="#4b8c4b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1049" y="205" fill="#285f2d" font-size="13.5" font-weight="780">Optional backup</text>
      <text x="1049" y="224" fill="#517b55" font-size="12.5">after hedge_now()</text>
    </g>

    <g fill="none" stroke="#59636e" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-slate)">
      <path d="M167 156H202"/>
      <path d="M547 160H582"/>
      <path d="M760 160H795"/>
    </g>
    <path d="M962 127H999" fill="none" stroke="#2e7d32" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <path d="M962 193C981 193 986 209 999 209" fill="none" stroke="#70a76d" stroke-width="2.1" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arrow-green)"/>

    <path d="M884 226V284H380V261" fill="none" stroke="#2b777a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arrow-teal)"/>
    <rect x="562" y="270" width="154" height="27" rx="13.5" fill="#fbfcfe" stroke="#b8d8d5"/>
    <text x="639" y="288" text-anchor="middle" fill="#2b777a" font-size="13.5" font-weight="750">REPORT OUTCOMES</text>
  </g>
</svg>
