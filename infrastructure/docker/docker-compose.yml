# Docker Compose configuration for hybridInference development infrastructure
#
# Usage:
#   Development:  docker compose -f infrastructure/docker/docker-compose.yml up -d
#   With pgAdmin: docker compose -f infrastructure/docker/docker-compose.yml --profile admin up -d
#   With Redis:   docker compose -f infrastructure/docker/docker-compose.yml --profile redis up -d
#   Stop all:     docker compose -f infrastructure/docker/docker-compose.yml down

version: '3.8'

services:
  # PostgreSQL database for API request logging and metrics
  # Replaces SQLite for unified dev/test/prod environment
  postgres:
    image: postgres:16
    container_name: hybridinference-postgres
    restart: unless-stopped
    environment:
      # Database credentials (REQUIRED: must be set in .env file)
      # SECURITY: No default passwords - you must provide these values
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env file}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env file}
      # Use C.UTF-8 locale (available by default in postgres:16)
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Named volume for persistent data storage
      - postgres_data:/var/lib/postgresql/data
      # Optional: mount initialization scripts
      # - ../../scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Performance tuning with production-safe settings
    # Optimized for API logging workload with high write throughput
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    networks:
      - hybridinference

  # pgAdmin - Web UI for PostgreSQL management
  # Access at http://localhost:5050 after starting with --profile admin
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: hybridinference-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "${PGADMIN_CONFIG_SERVER_MODE:-False}"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Optional: preconfigure server connection
      # - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hybridinference
    profiles:
      - admin

  # Prometheus - Metrics collection (if METRICS_ENABLED=1)
  # Reads config from infrastructure/prometheus/prometheus.yml
  prometheus:
    image: prom/prometheus:latest
    container_name: hybridinference-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - hybridinference
    profiles:
      - observability

  # Grafana - Metrics visualization dashboard
  # Access at http://localhost:3000 (default login: admin/admin)
  grafana:
    image: grafana/grafana:latest
    container_name: hybridinference-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ${GRAFANA_PLUGINS:-}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - hybridinference
    profiles:
      - observability

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Dedicated network for service isolation
networks:
  hybridinference:
    driver: bridge
