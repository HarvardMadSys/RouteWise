# Artifact manifest: maps paper claims/figures to runnable targets.
#
# This file is the machine-readable source of truth for `python -m artifact`.
# `runner` reads it to dispatch targets; `verify` reads `expected.yaml`
# (never this file's expectations — there are none here by design).
#
# Classes (this artifact's own taxonomy, not an official EuroSys category —
# the official badges are Available / Functional / Reproduced):
#   A      full reproduction — deterministic trace-driven simulation; same
#          seed reproduces the paper numbers, checked against expected.yaml
#   B1     recorded-result reproduction — the paper's frozen 24h records ->
#          metrics -> figures; deterministic re-analysis, also checked
#          against expected.yaml
#   B2     live rerun — optional, needs provider keys, costs money, and is
#          NON-DETERMINISTIC: provider load, pricing, and rate limits have
#          changed, so it produces a new timestamped result and is NEVER
#          compared against paper numbers (schema/completeness/sanity
#          checks only; no expected.yaml entry)
#   C      non-computational figure — no reproduction target
#   smoke  pipeline sanity on the built-in fixture, no paper claim
#
# Statuses: runnable | pending-calibration | pending-records | non-verifiable
# pending-* targets are being pinned against the pinned arXiv PDF during
# the kick-the-tires window; `reproduce` refuses them with this context.

# The single source of truth for every claim, figure number, and expected
# value is ONE pinned arXiv version of the paper (not the Overleaf master,
# not the local working tree). Targets are calibrated figure-by-figure
# against that PDF; the fields below pin it immutably once chosen — arXiv
# postings can gain v2/v3, so the version suffix and PDF hash are required.
paper:
  title: "RouteWise: Latency-Cost Optimization for Multi-Provider LLM Routing"
  venue: "EuroSys 2027"
  submission_id: 96
  arxiv_id: pending-pin
  arxiv_version: pending-pin
  pdf_sha256: pending-pin
  artifact_commit: pending-submission

targets:
  smoke-cost-layer:
    class: smoke
    claim: >-
      Pipeline sanity: the cost-layer simulator section runs end to end on the
      committed synthetic fixture (no paper claim).
    entrypoint: experiments.simulation.cost_layer
    args:
      - --scenario
      - cost_layer_uniform
      - --workload
      - smoke
      - --max-requests
      - "100"
      - --seed
      - "42"
      - --alpha
      - "0.5"
      - --output-dir
      - outputs/smoke/cost_layer
    outputs: outputs/smoke/cost_layer/summary.json
    est_minutes: 2

  figure-08-freeinference-frontier:
    class: A
    claim: "Fig 8a-d: FreeInference end-to-end cost/TTFT frontier and provider mix."
    entrypoint: experiments.simulation.end_to_end
    status: pending-calibration
    status_reason: >-
      Arguments and the FreeInference derived trace (arrival + token counts,
      no text) are being pinned during kick-the-tires.

  figure-09a-output-length:
    class: A
    claim: "Fig 9a: output-length misprediction robustness (-50%..+200%)."
    status: pending-calibration
    status_reason: Ablation entrypoint being wired into the module path.

  figure-09b-quota-cost:
    class: A
    claim: "Fig 9b: quota-tier effective cost."
    entrypoint: experiments.simulation.cost_layer
    status: pending-calibration
    status_reason: Scenario arguments being pinned against the pinned arXiv PDF.

  figure-09c-concurrency-cost:
    class: A
    claim: "Fig 9c: concurrency-tier effective cost."
    entrypoint: experiments.simulation.cost_layer
    status: pending-calibration
    status_reason: Scenario arguments being pinned against the pinned arXiv PDF.

  table-30d-hedging:
    class: A
    claim: >-
      30-day simulation hedging comparison (cost, SLO violations, P99 TTFT at
      alpha=0.5).
    entrypoint: experiments.simulation.hedging
    status: pending-calibration
    status_reason: Requires the BurstGPT+ShareGPT workload; see README data setup.

  table-30d-cost-baselines:
    class: A
    claim: "30-day RouteWise alpha=0 vs greedy-cost total cost."
    entrypoint: experiments.simulation.cost_layer
    status: pending-calibration
    status_reason: Requires the BurstGPT+ShareGPT workload; see README data setup.

  table-offline-gap:
    class: A
    claim: "Offline cost-only gap (19.3% vs 15.0%)."
    status: pending-calibration
    status_reason: Offline-stage scenario wiring being pinned.

  figure-02-provider-latency:
    class: B1
    claim: >-
      Fig 2a/2b: provider TTFT drift over wall-clock time (Llama-3.3-70B and
      gpt-4o-mini). Rebuilds drift_wall_clock_llama/_gpt4o from the committed
      raw CSVs; the mapping onto the paper's figure02a/02b files is confirmed
      against the pinned arXiv PDF during kick-the-tires.
    entrypoint: plots.motivation.drift_wall_clock
    args:
      - --source-dir
      - data/drift_source
      - --output-dir
      - outputs/figures/motivation
    outputs: outputs/figures/motivation/drift_wall_clock.summary.json
    est_minutes: 1

  figure-06-24h-ttft-mix:
    class: B1
    claim: "Fig 6a/6b: 24h MiniMax TTFT distribution and provider mix."
    status: pending-records
    status_reason: Allowlist-exported 24h records land in data/real_eval_records/.

  table-24h-real-eval:
    class: B1
    claim: >-
      24h real-provider numbers: hedge comparison, alpha=0 vs OR-price, backup
      trigger/win rates, utilization.
    status: pending-records
    status_reason: Allowlist-exported 24h records land in data/real_eval_records/.

  table-24h-live-rerun:
    class: B2
    claim: >-
      Optional live rerun of the 24h real-provider evaluation with the
      reviewer's own keys. Non-deterministic by nature: it yields a new
      timestamped result set and is validated for schema, completeness, and
      qualitative sanity (a cost-latency trade-off forms) — never against
      the paper's recorded numbers.
    status: pending-calibration
    status_reason: >-
      Runner arguments and the timestamped output layout are wired after the
      B1 records land; requires .env provider keys and spends real money.

  figure-07a-provider-latency-snapshot:
    class: C
    claim: "Fig 7a: provider latency snapshot."
    status: non-verifiable
    status_reason: >-
      Author-reconstructed snapshot: original logs were lost; the committed
      JSON is hand-entered and the figure only replots it. Documented as-is;
      verify never treats this as reproduced from raw experiments.

  figure-07b-provider-pricing:
    class: C
    claim: "Fig 7b: provider pricing snapshot."
    status: non-verifiable
    status_reason: Archived derived figure input (pricing snapshot with capture date).

  figure-01-intro:
    class: A
    claim: "Fig 1a/1b: intro total-TTFT and SLO-violation overview."
    status: pending-calibration
    status_reason: Data source being confirmed against the pinned arXiv PDF.

  figure-04-architecture:
    class: C
    claim: "Fig 4: system architecture diagram."
    status: non-verifiable
    status_reason: Non-computational figure; no reproduction target.

  figure-05-hedging-timeline:
    class: C
    claim: "Fig 5: smart-hedging timeline illustration."
    status: non-verifiable
    status_reason: Non-computational figure; no reproduction target.
